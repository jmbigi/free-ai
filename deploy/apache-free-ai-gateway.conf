# /etc/httpd/sites-available/free-ai-gateway.conf (example)
# Public HTTPS reverse proxy for Free AI Gateway (uvicorn on 127.0.0.1:8000)
# 1) Copy to /etc/httpd/sites-available/free-ai-gateway.conf
# 2) ln -s ../sites-available/free-ai-gateway.conf /etc/httpd/sites-enabled/
# 3) Ensure modules: proxy proxy_http headers ssl rewrite
# 4) Obtain cert: certbot --apache -d ai.forthtrade.com
# 5) apachectl configtest && systemctl reload httpd

<VirtualHost *:80>
    ServerName ai.forthtrade.com
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName ai.forthtrade.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ai.forthtrade.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ai.forthtrade.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8000/ connectiontimeout=10 timeout=300
    ProxyPassReverse / http://127.0.0.1:8000/
    SetEnv proxy-sendchunked 1

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog /var/log/httpd/free-ai-gateway-error.log
    CustomLog /var/log/httpd/free-ai-gateway-access.log combined
</VirtualHost>
