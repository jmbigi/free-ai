# Apache reverse proxy for Free AI Gateway on ia.forthtrade.com
# Install (requires sudo):
#   sudo cp /home/admin/free-ai/deploy/ia.forthtrade.com.conf /etc/httpd/sites-available/ia.forthtrade.com.conf
#   sudo ln -s ../sites-available/ia.forthtrade.com.conf /etc/httpd/sites-enabled/ia.forthtrade.com.conf
#   sudo apachectl configtest && sudo systemctl reload httpd
# Then obtain HTTPS cert:
#   sudo certbot --apache -d ia.forthtrade.com
# After certbot, ProxyPass/SSL lines will be in the *-le-ssl.conf; verify and reload if needed.

<VirtualHost *:80>
    ServerName ia.forthtrade.com
    # Let certbot manage HTTP challenge/redirect, but keep a safe fallback:
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass /.well-known/ !
    ProxyPass / http://127.0.0.1:8000/ connectiontimeout=10 timeout=300
    ProxyPassReverse / http://127.0.0.1:8000/
    SetEnv proxy-sendchunked 1

    ErrorLog /var/log/httpd/ia-forthtrade-gateway-error.log
    CustomLog /var/log/httpd/ia-forthtrade-gateway-access.log combined
</VirtualHost>
